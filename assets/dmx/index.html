<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrandMA2 DMX View</title>
    
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>

    <div class="status-header-card glassy-surface">
        <div>
            <h1 class="main-title">GrandMA2 DMX View</h1>
        </div>
        <div class="header-actions">

            <button class="btn-header btn-header-ghost" onclick="clearPatchList()" title="Clear List and start a new session">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 1 0 2.6-6.4L2 9"/></svg> New Session
            </button>
            <div class="header-divider"></div>
            
            <button class="btn-header btn-header-pull" onclick="pullFromGrandMA2()" title="Pull directly from GrandMA2 via Telnet">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg> Pull from MA2
            </button>
            
            <button class="btn-header btn-header-ghost" onclick="importPatchXMLNative()" title="Select Patch XML File">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Import XML
            </button>
        </div>
    </div>

    <div class="layout-grid">
        <div class="glassy-surface sidebar-card h-fit">
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h2 class="list-header" style="margin:0; border:none; padding:0;">Universe Details</h2>
                </div>
                
                <div id="universe-sidebar-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px;">
                    <!-- Universe buttons populated by JS -->
                </div>

                <div id="fixture-legend-container" style="display: none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h2 class="list-header" style="margin:0; border:none; padding:0;">Fixture Legend</h2>
                    </div>
                    <div id="fixture-legend-list" style="display: flex; flex-direction: column; gap: 6px;">
                        <!-- Legend items populated by JS -->
                    </div>
                </div>
            </div>
        </div>

        <div class="glassy-surface workspace-container" style="display: flex; flex-direction: column; position: relative; height: calc(100vh - 120px);">
            <div class="table-scroll-wrapper" style="position: relative; flex-grow: 1; padding: 24px; overflow-y: auto;">
            <div class="empty-state" id="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
                <h3>No Patch Loaded</h3>
                <p>Pull directly from GrandMA2 or import a Patch XML to view universes.</p>
            </div>
            
            <div id="dmx-grid-container" style="display: none;">
                <!-- Grid will be generated here -->
            </div>
        </div>
        </div>
    </div>

    <div class="modal-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text" class="loading-text">Communicating...</div>
    </div>

    <div class="modal-overlay" id="login-modal">
        <div class="modal-content" style="width: 340px;">
            <button class="modal-close" onclick="closeModal('login-modal')">✕</button>
            <h2 class="modal-header-title">MA2 Console Login</h2>
            <div class="form-group">
                <label for="login-ip">IP Address</label>
                <input type="text" id="login-ip" class="form-control" placeholder="Select or type IP..." list="ip-list" onfocus="this.value=''">
                <datalist id="ip-list"></datalist>
            </div>
            <div class="form-group">
                <label for="login-user">Username</label>
                <input type="text" id="login-user" class="form-control" value="administrator">
            </div>
            <div class="form-group">
                <label for="login-pass">Password</label>
                <input type="password" id="login-pass" class="form-control" value="admin">
            </div>
            <button class="btn-primary" style="width: 100%; margin-top: 8px;" onclick="submitLogin()">Save & Connect</button>
        </div>
    </div>


    <div class="modal-overlay" id="layer-editor-modal">
        <div class="modal-content" style="width: 360px;">
            <button class="modal-close" onclick="closeModal('layer-editor-modal')">×</button>
            <h2 class="modal-header-title no-color" id="layer-editor-title">Footprints</h2>
            <div id="layer-editor-list" style="margin-top: 15px; max-height: 300px; overflow-y: auto;">
                <!-- Dynamically populated rows -->
            </div>
            <button class="btn-primary" style="width: 100%; margin-top: 15px;" onclick="submitLayerFootprints()">Save All</button>
        </div>
    </div>

    <div id="toast-container"></div>
    
    <!-- Tooltip Element -->
    <div id="fixture-tooltip" class="fixture-tooltip"></div>
    <div class="copyright-text">© GrandMA2 Hub</div>
    <script src="script.js"></script>
</body>
</html>
