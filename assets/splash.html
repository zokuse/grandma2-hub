<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MA2 Hub Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }
        
        .splash-card {
            width: 700px;
            height: 250px;
            background-color: #141414;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            border: none;
            box-sizing: border-box;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 24px;
            margin-top: -20px;
        }

        .icon-container {
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-text {
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .brand-main {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 46px;
            font-weight: 600;
            color: #fff;
            margin: 0;
            letter-spacing: -0.02em;
        }
        
        .brand-main span {
            color: #fdd835;
            font-weight: 300;
            margin-left: 10px;
        }

        .bottom-bar {
            position: absolute;
            bottom: 20px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        #loading-text {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            color: #a0a0a0;
            margin: 0;
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        #version-text {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 12px;
            color: #888;
            margin: 0;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="content">
            <div class="icon-container">
                <img src="icon.ico" alt="" onerror="this.style.display='none'" />
            </div>
            <div class="brand-text">
                <h1 class="brand-main">MA2<span>Hub</span></h1>
            </div>
        </div>

        <div class="bottom-bar">
            <p id="loading-text">Initializing core system...</p>
            <p id="version-text">...</p>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const version = urlParams.get('version');
        if (version) {
            document.getElementById('version-text').textContent = 'v' + version;
        }

        const loadingStates = [
            "Mounting IPC Bridge...",
            "Initializing GrandMA2 Telnet client...",
            "Loading UI Assets...",
            "Starting Art-Net Engine on 0.0.0.0:6454...",
            "Loading glTF 3D Parser...",
            "Waking up MA2 backend...",
            "Ready."
        ];
        
        const textEl = document.getElementById('loading-text');
        let stateIndex = 0;
        
        const interval = setInterval(() => {
            if (stateIndex < loadingStates.length) {
                textEl.textContent = loadingStates[stateIndex];
                stateIndex++;
            } else {
                clearInterval(interval);
            }
        }, 150);
    </script>
</body>
</html>
