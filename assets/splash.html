<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MA2 Hub Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }
        
        .splash-card {
            width: 560px;
            height: 200px;
            background: #141414; /* Solid, highly performant dark background */
            border: 1px solid #333;
            border-radius: 12px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            padding: 0 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .logo-container {
            flex-shrink: 0;
            margin-right: 32px;
        }

        .logo-container img {
            width: 96px;
            height: 96px;
            object-fit: contain;
        }

        .content-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .header-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.03em;
            color: #fff;
        }

        .version-tag {
            font-size: 13px;
            font-weight: 600;
            color: #fdd835;
            background: rgba(253, 216, 53, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(253, 216, 53, 0.2);
        }

        p {
            font-size: 14px;
            color: #888;
            margin: 0 0 24px 0;
            letter-spacing: 0.05em;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: #2a2a2a;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #fdd835;
            border-radius: 2px;
            animation: load 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="splash-card">
        <div class="logo-container">
            <img src="icon.ico" alt="" onerror="this.style.display='none'" />
        </div>
        <div class="content-container">
            <div class="header-row">
                <h1>MA2 Hub</h1>
                <span class="version-tag" id="version-text">v...</span>
            </div>
            <p>Initializing modules...</p>
            <div class="progress-container">
                <div class="progress-bar"></div>
            </div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const version = urlParams.get('version');
        if (version) {
            document.getElementById('version-text').textContent = 'v' + version;
        }
    </script>
</body>
</html>
