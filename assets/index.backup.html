<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrandMA2 Hub</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #1e1e1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        #sidebar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 64px;
            background-color: #121212;
            border-right: 1px solid #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            padding-bottom: 10px;
            transition: width 0.2s ease-out, box-shadow 0.2s ease-out;
            will-change: width;
            z-index: 100;
        }

        #sidebar:hover, #sidebar.expanded {
            width: 200px;
            box-shadow: 5px 0 25px rgba(0, 0, 0, 0.3), 15px 0 50px rgba(0, 0, 0, 0.2);
            border-right: 1px solid #444444;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            width: calc(100% - 10px);
            margin: 4px 5px;
            padding: 12px 10px;
            cursor: pointer;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            outline: none;
            text-align: left;
            position: relative;
            min-height: 44px;
            box-sizing: border-box;
            transition: background-color 0.2s, border 0.2s;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .nav-btn.active {
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fdd835;
        }

        .nav-btn.active svg path, .nav-btn.active svg polyline, .nav-btn.active svg line, .nav-btn.active svg rect, .nav-btn.active svg circle {
            stroke: #fdd835 !important;
        }

        .nav-icon {
            width: 32px;
            min-width: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-icon svg {
            width: 22px;
            height: 22px;
        }

        .nav-label {
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
            margin-left: 10px;
        }

        #sidebar:hover .nav-label, #sidebar.expanded .nav-label {
            opacity: 1;
        }

        .divider {
            height: 1px;
            width: calc(100% - 20px);
            background-color: rgba(255, 255, 255, 0.08);
            margin: 5px 10px;
        }

        .spacer {
            flex-grow: 1;
        }

        #content {
            position: absolute;
            left: 64px;
            right: 0;
            top: 0;
            bottom: 0;
            background-color: #1e1e1e;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <button class="nav-btn active" onclick="switchTab('home', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            </div>
            <span class="nav-label">Home</span>
        </button>

        <div class="divider"></div>

        <button class="nav-btn" onclick="switchTab('cloner', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </div>
            <span class="nav-label">Visual Cloner</span>
        </button>

        <button class="nav-btn" onclick="switchTab('patch', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </div>
            <span class="nav-label">Patch List</span>
        </button>

        <button class="nav-btn" onclick="switchTab('xyz', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="16" x2="8" y2="4"></line><polyline points="5 7 8 4 11 7"></polyline><line x1="8" y1="16" x2="20" y2="16"></line><polyline points="17 13 20 16 17 19"></polyline><line x1="8" y1="16" x2="3" y2="21"></line><polyline points="3 17 3 21 7 21"></polyline></svg>
            </div>
            <span class="nav-label">XYZ Injector</span>
        </button>

        <button class="nav-btn" onclick="switchTab('gltf', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            </div>
            <span class="nav-label">glTF Unpacker</span>
        </button>

        <button class="nav-btn" onclick="switchTab('dmx', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
            </div>
            <span class="nav-label">DMX View</span>
        </button>

        <div class="spacer"></div>

        <button class="nav-btn" onclick="switchTab('settings', this)">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
            <span class="nav-label">Settings</span>
        </button>
    </div>

    <div id="content">
        <!-- iframes will be injected here via JavaScript -->
    </div>

    <script>
        const tools = [
            { id: 'home', url: 'home-app/dist/index.html' },
            { id: 'cloner', url: 'cloner/index.html' },
            { id: 'patch', url: 'patch/index.html' },
            { id: 'xyz', url: 'xyz/index.html' },
            { id: 'gltf', url: 'gltf/index.html' },
            { id: 'dmx', url: 'dmx/index.html' },
            { id: 'settings', url: 'settings-app/dist/index.html' }
        ];

        const contentDiv = document.getElementById('content');
        const frames = {};

        // Pre-load ALL tabs at startup (mimics PyQt6 QStackedWidget behavior for 0 delay)
        tools.forEach(tool => {
            const iframe = document.createElement('iframe');
            iframe.src = tool.url;
            iframe.id = 'frame-' + tool.id;
            
            // Hide all except home
            if (tool.id !== 'home') {
                iframe.style.display = 'none';
            }
            
            // Injeksi Polyfill dari parent ke iframe
            iframe.onload = function() {
                if (window.qt) {
                    this.contentWindow.qt = window.qt;
                    this.contentWindow.QWebChannel = window.QWebChannel;
                }
            };
            
            contentDiv.appendChild(iframe);
            frames[tool.id] = iframe;
        });

        function switchTab(toolId, btnElement) {
            // Hide all frames
            Object.values(frames).forEach(frame => {
                frame.style.display = 'none';
            });
            
            // Show requested frame instantly (no loading delay!)
            frames[toolId].style.display = 'block';
            
            // Update button visual states
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            btnElement.classList.add('active');
            
            // Collapse sidebar on touch devices after selecting
            document.getElementById('sidebar').classList.remove('expanded');
        }

        // Touchscreen support for sidebar toggle (migrated from PyQt eventFilter)
        const sidebar = document.getElementById('sidebar');
        sidebar.addEventListener('click', (e) => {
            // If they clicked the sidebar background (not a button), toggle it
            if (!e.target.closest('.nav-btn')) {
                sidebar.classList.toggle('expanded');
            }
        });
        
        // Collapse when clicking outside the sidebar
        document.addEventListener('click', (e) => {
            if (!sidebar.contains(e.target)) {
                sidebar.classList.remove('expanded');
            }
        });
    </script>
</body>
</html>
